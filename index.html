<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Attendance System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h2 { margin-top: 0; color: #2c3e50; }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            background-color: #2ecc71;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }
        button:hover {
            background-color: #27ae60;
        }
        .danger-btn {
            background-color: #e74c3c;
            width: auto;
            padding: 5px 10px;
            font-size: 12px;
            margin: 0;
        }
        .danger-btn:hover {
            background-color: #c0392b;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
            font-size: 14px;
        }
        th {
            background-color: #2c3e50;
            color: white;
        }
        .actions-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .badge {
            padding: 3px 8px;
            border-radius: 4px;
            color: white;
            font-size: 12px;
        }
        .Present { background-color: #27ae60; }
        .Late { background-color: #f39c12; }
        .Absent { background-color: #e74c3c; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Attendance Check-In</h2>
        <form id="attendanceForm">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="Enter attendee name" required>
            </div>
            <div class="form-group">
                <label for="status">Status</label>
                <select id="status">
                    <option value="Present">Present</option>
                    <option value="Late">Late</option>
                    <option value="Absent">Absent</option>
                </select>
            </div>
            <button type="submit">Record Attendance</button>
        </form>
    </div>

    <div class="container">
        <h2>Attendance Records</h2>
        <div class="actions-bar">
            <input type="text" id="searchInput" placeholder="Search by name..." onkeyup="filterRecords()">
            <button type="button" onclick="clearAllRecords()" style="background-color: #e74c3c; width: 150px;">Clear All</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Status</th>
                    <th>Date & Time</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Dynamically filled -->
            </tbody>
        </table>
    </div>

    <script>
        // Initialize records from browser storage or empty array
        let attendanceList = JSON.parse(localStorage.getItem('my_attendance')) || [];

        const form = document.getElementById('attendanceForm');
        const tableBody = document.getElementById('tableBody');
        const searchInput = document.getElementById('searchInput');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('fullName').value.trim();
            const status = document.getElementById('status').value;
            const now = new Date();
            const timestamp = now.toLocaleDateString() + ' ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const newEntry = {
                id: Date.now(),
                name: name,
                status: status,
                time: timestamp
            };

            attendanceList.unshift(newEntry); // Add newest to top
            saveAndRefresh();
            form.reset();
        });

        function renderTable(data) {
            tableBody.innerHTML = '';

            if (data.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #777;">No records found.</td></tr>`;
                return;
            }

            data.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${escapeHTML(item.name)}</td>
                    <td><span class="badge ${item.status}">${item.status}</span></td>
                    <td>${item.time}</td>
                    <td><button class="danger-btn" onclick="deleteItem(${item.id})">Delete</button></td>
                `;
                tableBody.appendChild(row);
            });
        }

        function deleteItem(id) {
            attendanceList = attendanceList.filter(item => item.id !== id);
            saveAndRefresh();
        }

        function clearAllRecords() {
            if (confirm('Are you sure you want to clear all records?')) {
                attendanceList = [];
                saveAndRefresh();
            }
        }

        function filterRecords() {
            const query = searchInput.value.toLowerCase();
            const filtered = attendanceList.filter(item => item.name.toLowerCase().includes(query));
            renderTable(filtered);
        }

        function saveAndRefresh() {
            localStorage.setItem('my_attendance', JSON.stringify(attendanceList));
            renderTable(attendanceList);
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // Initial load
        renderTable(attendanceList);
    </script>
</body>
</html>
